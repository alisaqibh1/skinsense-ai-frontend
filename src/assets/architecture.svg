<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>SkinSense AI architecture</title>
<desc>React frontend on Vercel talks over HTTPS to a FastAPI backend on Hugging Face Spaces, which loads a DINOv2 model bundled via Git LFS and calls the Groq API for medical advice.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M1 1L9 5L1 9Z" fill="#0891B2"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M1 1L9 5L1 9Z" fill="#DC2626"/>
  </marker>
</defs>

<rect width="900" height="420" fill="#ffffff"/>

<!-- Frontend -->
<rect x="30" y="150" width="220" height="100" rx="14" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.5"/>
<text x="140" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0E7490">React frontend</text>
<text x="140" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0891B2">Vercel</text>
<text x="140" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0891B2">skinsenseai-pk.vercel.app</text>

<!-- Backend -->
<rect x="340" y="150" width="230" height="100" rx="14" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.5"/>
<text x="455" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0E7490">FastAPI backend</text>
<text x="455" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0891B2">Docker container</text>
<text x="455" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0891B2">Hugging Face Spaces</text>

<!-- Model -->
<rect x="650" y="150" width="220" height="100" rx="14" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
<text x="760" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#B91C1C">DINOv2 model</text>
<text x="760" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#DC2626">Private HF model repo</text>
<text x="760" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#DC2626">alisaqib14/skin-disease-model</text>

<!-- Groq -->
<rect x="340" y="310" width="230" height="90" rx="14" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
<text x="455" y="345" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#B91C1C">Groq API</text>
<text x="455" y="368" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#DC2626">Llama 3 — medical advice</text>
<text x="455" y="386" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#DC2626">turns prediction into explanation</text>

<!-- Frontend -> Backend (request) -->
<line x1="253" y1="185" x2="337" y2="185" stroke="#0891B2" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="295" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0E7490">HTTPS image</text>

<!-- Backend -> Frontend (response) -->
<line x1="337" y1="215" x2="253" y2="215" stroke="#0891B2" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="295" y="235" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0E7490">JSON result</text>

<!-- Backend -> Model -->
<line x1="573" y1="190" x2="647" y2="190" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
<text x="610" y="177" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#B91C1C">bundled via</text>
<text x="610" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#B91C1C">Git LFS</text>

<!-- Backend -> Groq -->
<line x1="455" y1="253" x2="455" y2="307" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
<text x="530" y="284" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#B91C1C">prediction</text>

<!-- Caption -->
<text x="450" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#111827">SkinSense AI — system architecture</text>
<text x="450" y="62" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6B7280">User uploads a skin image → classified by DINOv2 → Groq generates a plain-language explanation → PDF report</text>
</svg>
